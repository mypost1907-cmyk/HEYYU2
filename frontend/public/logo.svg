<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.8"/>
  
  <!-- Play Buttons -->
  <polygon points="200,156 200,356 356,256" fill="white" opacity="0.9"/>
  <polygon points="380,220 380,292 420,256" fill="white" opacity="0.7"/>
  
  <!-- Sound Wave Lines (bottom) -->
  <rect x="140" y="400" width="4" height="40" fill="white" opacity="0.6" rx="2"/>
  <rect x="160" y="420" width="4" height="20" fill="white" opacity="0.6" rx="2"/>
  <rect x="180" y="410" width="4" height="30" fill="white" opacity="0.6" rx="2"/>
  <rect x="200" y="395" width="4" height="45" fill="white" opacity="0.6" rx="2"/>
  <rect x="220" y="415" width="4" height="25" fill="white" opacity="0.6" rx="2"/>
</svg>
